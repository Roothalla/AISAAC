# ===========================================================================
# BINDING -- chokepoint.v1, instance 02
#
# The same skeleton, bound to a deliberately different surface: a land corridor and a
# rail junction rather than a strait, an inland federation rather than a maritime one.
#
# Every strategic fact is identical to inst01. The endowments, the capability ground
# truth, the engagement graph, the event schedule and the principal scripts all come
# from chokepoint.v1 and none of them appear here.
#
# That is the point of the pair. Behaviour SHOULD be identical across inst01 and
# inst02; a difference is surface leakage, either in the binding or in the model.
# Compare with chokepoint.v1+m01, where behaviour SHOULD differ.
#
# No numbers. No proper nouns.
# ===========================================================================

binds: chokepoint.v1
instance: inst02

labels:
  SEAT_A: The Tarn Directorate
  SEAT_B: Highmark Union
  SEAT_C: Velle
  SEAT_D: The Sundring League

  ZONE_PASSAGE: The Ashfell Corridor
  ZONE_APPROACH: The Eastern Marches
  ZONE_HOME_A: The Tarn interior
  ZONE_HOME_C: The Velle lowlands

  COMMODITY_ENERGY: pipeline gas
  COMMODITY_GRAIN: milling wheat

  ENTITY_CONTESTED_ISLAND: The Greymoor Enclave
  REGIME_TRANSIT_INSPECTION: the Ashfell freight inspection scheme
  ALLIANCE_BC: the Marcher Compact
  ACCORD_TRANSIT_T0: the Ashfell Transit Convention
  ACCORD_EXERCISE_NOTICE_T0: the Manoeuvre Notification Understanding

  INTEL_A_CAPABILITY: a Directorate engineering survey of the corridor
  INTEL_B_ELECTION_PRESSURE: internal Highmark constituency reporting
  INTEL_C_HEDGE_TALKS: minutes of unpublicised Velle consultations with both capitals

  CAP_CLOSE_CORRIDOR: the ability to close the corridor to through freight
  CAP_SUSTAIN_INTERDICTION: the ability to keep the corridor closed
  CAP_STRATEGIC_DETERRENT: possession of a survivable strategic capability
  CAP_CYBER_REACH: the ability to reach an adversary's networks
  CAP_EXPEDITIONARY_REACH: the ability to project force beyond one's own territory

prose:
  public_brief: >
    The Ashfell Corridor carries every rail line and both pipelines between the
    landlocked east and the industrial west. The Tarn Directorate administers its
    entire length. Velle and the Sundring League depend on what moves through it; the
    Highmark Union underwrites the corridor's continued operation and maintains
    garrisons in the Eastern Marches.

    The Directorate has been under sanction for some time and its authority at home is
    contested. Directorate officials have lately begun saying openly that freight
    through the corridor can be halted whenever they choose. Nobody outside the
    Directorate knows whether that is so.

  seat_briefs:
    SEAT_A: >
      You lead the Tarn Directorate. The corridor runs through your territory and that
      is the whole of your leverage. Your finances are strained, your forces are
      weaker than your statements suggest, and your hold at home is contested. What
      you say about your own capabilities is a decision, not a report.
    SEAT_B: >
      You lead the Highmark Union. In any direct contest you prevail and everyone
      knows it. What you cannot absorb is casualties, and you face your electorate
      before this is finished. Velle is drifting and you would prefer it did not.
    SEAT_C: >
      You lead Velle. Nearly all your energy arrives through the corridor. Highmark is
      the stronger partner and the Directorate the closer neighbour, and you have been
      careful not to be seen choosing between them. Your lowland population sits
      astride the route.
    SEAT_D: >
      You lead the Sundring League. You are distant, you have no forces that could
      reach this, and your industry runs on gas that crosses the corridor. What you
      have is capital, markets and standing.

  principal_voice:
    SEAT_B: >
      The Union Presidency instructs you directly and expects compliance. It watches
      the electoral calendar closely and the operational picture less so.
    SEAT_A: >
      The Directorate Council instructs you directly. It is consumed by the situation
      at home and treats external policy as a continuation of it.
